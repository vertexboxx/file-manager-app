<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary"><div class="container-fluid"><a class="navbar-brand" href="/">📂 File Manager</a></div></nav>
<main class="container my-5">
<div class="card mx-auto" style="max-width:480px;"><div class="card-body">
<h4>Login</h4>
{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category,msg in messages %}<div class="alert alert-{{category}}">{{msg}}</div>{% endfor %}{% endif %}{% endwith %}
<form method="POST">
  <div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" required></div>
  <div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div>
  <div class="d-grid gap-2"><button class="btn btn-primary" type="submit">Login</button></div>
</form>
<p class="mt-3 small">Or <a href="/register">create an account</a></p>
</div></div></main>

<!-- Credits Section -->
<div class="container text-center mt-4 mb-4">
    <hr>
    <p class="text-muted">
        Developed by <a href="/dev-replica" target="_blank">DEV FIESTA</a> | Team Vertex
    </p>
</div>

</body></html>
